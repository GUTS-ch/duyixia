name: syntax-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m py_compile app/*.py scripts/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript
        run: node --check app/web/app.js
      - name: Restore icon assets
        run: python scripts/prepare_assets.py
